<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builder Base Maxed</title>
<meta name="description" content="Hassan's Clash of Clans Builder Base: every upgrade complete.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1a24;
    --bg-2: #162533;
    --card: #1c2f40;
    --line: #2c4458;
    --text: #eef4f8;
    --muted: #9fb3c4;
    --gold: #f5b301;
    --gold-deep: #c98a00;
    --elixir: #b25ce6;
    --trophy: #4fb3ff;
    --green: #5ccf3c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #23405a 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font-family: "Nunito", system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  h1, h2, .num, .badge { font-family: "Lilita One", "Nunito", sans-serif; font-weight: 400; letter-spacing: .5px; }

  /* Hero */
  header { text-align: center; padding: 64px 0 40px; }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(#2a3d26, #1b2a18);
    border: 2px solid var(--green);
    color: #d9ffc9;
    padding: 8px 18px; border-radius: 999px;
    font-size: 15px; text-transform: uppercase;
    box-shadow: 0 0 24px rgba(92, 207, 60, .25);
  }
  .badge .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
  h1 {
    font-size: clamp(42px, 9vw, 88px); line-height: 1; margin: 22px 0 12px;
    background: linear-gradient(180deg, #fff3b0 0%, var(--gold) 45%, var(--gold-deep) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1px rgba(0,0,0,.25);
    filter: drop-shadow(0 4px 0 #5a3d00);
  }
  .sub { color: var(--muted); font-size: clamp(16px, 2.6vw, 20px); margin: 0; }
  .sub strong { color: var(--text); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin: 8px 0 56px; }
  .stat {
    background: linear-gradient(180deg, var(--card), var(--bg-2));
    border: 1px solid var(--line); border-radius: 16px;
    padding: 18px 16px; text-align: center;
  }
  .stat .num { font-size: 36px; line-height: 1.1; }
  .stat .label { color: var(--muted); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .stat.xp .num { color: var(--trophy); }
  .stat.trophy .num { color: var(--elixir); }
  .stat.builders .num, .stat.lab .num { color: var(--green); }

  /* Gallery */
  h2 { font-size: clamp(28px, 5vw, 40px); margin: 0 0 18px; text-align: center; }
  .gallery { display: grid; gap: 28px; margin-bottom: 56px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  figure button { all: unset; display: block; cursor: zoom-in; width: 100%; }
  figure button:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
  figure img { display: block; width: 100%; height: auto; transition: transform .4s ease; }
  figure button:hover img { transform: scale(1.015); }
  figcaption { padding: 16px 20px 20px; }
  figcaption .tag { color: var(--gold); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  figcaption h3 { margin: 4px 0 6px; font-size: 20px; }
  figcaption p { margin: 0; color: var(--muted); }

  /* Resources */
  .resources { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; color: var(--muted); margin-bottom: 48px; }
  .resources span b { color: var(--text); }

  footer { text-align: center; color: var(--muted); padding: 24px 0 48px; border-top: 1px solid var(--line); }

  /* Lightbox */
  dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
  dialog::backdrop { background: rgba(5, 10, 15, .9); }
  dialog img { display: block; max-width: 96vw; max-height: 92vh; border-radius: 12px; }
  dialog form { text-align: center; margin-top: 8px; }
  dialog button { font: 700 15px "Nunito", sans-serif; background: var(--gold); color: #2b1d00; border: 0; border-radius: 999px; padding: 8px 20px; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) { figure img { transition: none; } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge"><span class="dot"></span>All upgrades complete</span>
      <h1>Builder Base Maxed</h1>
      <p class="sub"><strong>Hassan</strong> finished every building, wall, trap and troop in the Builder Base.</p>
    </header>

    <section class="stats" aria-label="Stats">
      <div class="stat xp"><div class="num">224</div><div class="label">XP level</div></div>
      <div class="stat trophy"><div class="num">4,543</div><div class="label">Builder trophies</div></div>
      <div class="stat builders"><div class="num">3/3</div><div class="label">Builders done</div></div>
      <div class="stat lab"><div class="num">1/1</div><div class="label">Star Lab done</div></div>
    </section>

    <h2>The proof</h2>
    <section class="gallery">
      <figure>
        <button type="button" data-full="screenshots/builder-base-stage-1.jpg" aria-label="Enlarge stage 1 screenshot">
          <img src="screenshots/builder-base-stage-1.jpg" alt="Fully upgraded Builder Hall village with the All Upgrades Complete banner" width="1918" height="1078" loading="lazy">
        </button>
        <figcaption>
          <div class="tag">Stage 1</div>
          <h3>Builder Hall village</h3>
          <p>Builders 3/3 and Star Laboratory 1/1, both showing "All Upgrades Complete".</p>
        </figcaption>
      </figure>
      <figure>
        <button type="button" data-full="screenshots/builder-base-stage-2.jpg" aria-label="Enlarge stage 2 screenshot">
          <img src="screenshots/builder-base-stage-2.jpg" alt="Fully upgraded O.T.T.O's Outpost stage with the All Upgrades Complete banner" width="1918" height="1078" loading="lazy">
        </button>
        <figcaption>
          <div class="tag">Stage 2</div>
          <h3>O.T.T.O's Outpost</h3>
          <p>The second battle stage is maxed as well. Nothing left to build.</p>
        </figcaption>
      </figure>
    </section>

    <div class="resources" aria-label="Resources at the time">
      <span>🪙 Gold <b>52,437</b></span>
      <span>💧 Elixir <b>321,723</b></span>
      <span>💎 Gems <b>663</b></span>
    </div>

    <footer>Grind complete. 🛠️</footer>
  </div>

  <dialog id="lightbox">
    <img alt="">
    <form method="dialog"><button>Close</button></form>
  </dialog>

  <script>
    const box = document.getElementById('lightbox');
    const boxImg = box.querySelector('img');
    document.querySelectorAll('[data-full]').forEach(btn => {
      btn.addEventListener('click', () => {
        boxImg.src = btn.dataset.full;
        boxImg.alt = btn.querySelector('img').alt;
        box.showModal();
      });
    });
    box.addEventListener('click', e => { if (e.target === box) box.close(); });
  </script>
</body>
</html>
